# Two processors (smp builds; master has no 54TDP), on BIOS 1.51, the
# two-processor revision. The saved CMOS names no IDE drive on the board's
# channels: the image is on a Promise card, whose BIOS boots it.
[General]
emu_build_dynarec_type = new
force_10ms = 1
vid_renderer = qt_software
confirm_exit = 0
confirm_reset = 0
confirm_save = 0

[Machine]
machine = 54tdp
cpu_family = pentium_p55c
cpu_speed = 233333333
cpu_multi = 3.5
cpu_use_dynarec = 1
cpu_count = 2
fpu_type = internal
mem_size = 65536
pit_mode = 1

[Video]
gfxcard = cl_gd5446_pci

[Input devices]
keyboard_type = keyboard_at
mouse_type = none

[Sound]
sndcard = none

[Network]
net_01_card = none

[Ports (COM & LPT)]
lpt1_enabled = 0
serial1_device = pipe

[Named Pipe (COM) #1]
path = @SERIAL@
mode = 0

[Floppy and CD-ROM drives]
fdd_01_type = none
fdd_02_type = none

[Storage controllers]
hdc_1 = pdc20269

[Hard disks]
hdd_01_fn = cputest.img
hdd_01_ide_channel = 0:0
hdd_01_parameters = 32, 16, 64, 0, ide

[AIR 54TDP]
bios = 54tdp_151
